[package]
name = "hyperion-ext-standard"
version = "0.1.0"
edition = "2024"

[dependencies]
hyperion-core = { path = "../../crates/hyperion-core" }
hyperion-parser = { path = "../../crates/hyperion-parser" }
lazy_static = "1.4"
regex = "1"
chrono = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
bcrypt = "0.16"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
rand = "0.8"
indexmap = "2.14.0"
rustc-hash = "2.1"
chrono-tz = "0.10.4"

aes = "0.8"
cbc = "0.1"
cipher = "0.4"
aes-gcm = "0.10"
mysql = "24.0"
glob = "0.3"
threadpool = "1.8.1"
crossbeam-channel = "0.5.15"
fancy-regex = "0.19.0"
rusqlite = { version = "0.31", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64", "xxh32"] }
dashmap = "6.1"
ureq = { version = "2.10", features = ["json", "cookies"] }
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

