name: PHP-Hyperion CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-and-installers:
    name: Lint & Installer Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Matrix
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache
          coverage: none

      - name: Validate Shell and Batch Installers
        run: |
          bash -n install.sh
          chmod +x install.sh
          chmod +x bin/hyperion-doctor

      - name: Verify Worker PHP Syntax
        run: |
          php -l hyperion_worker.php

      - name: Run Unified Unit Tests
        run: |
          python3 tests/run_all_tests.py --unit

  macos-verification:
    name: macOS Deployment Verification
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath
          coverage: none

      - name: Run Universal Unit Battery
        run: |
          python3 tests/run_all_tests.py --unit
